<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#05060a">
<title>Space Invaders</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#05060a;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#e8f0ff;
    overscroll-behavior:none;touch-action:none;user-select:none;-webkit-user-select:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  canvas{display:block;touch-action:none;image-rendering:pixelated;}
  #hud{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;
    padding:calc(8px + env(safe-area-inset-top)) 14px 0;font-size:13px;letter-spacing:2px;
    pointer-events:none;opacity:.85;}
  #overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:18px;background:rgba(5,6,10,.88);text-align:center;padding:24px;
    backdrop-filter:blur(2px);}
  #overlay.hidden{display:none;}
  h1{margin:0;font-size:clamp(22px,7vw,38px);letter-spacing:6px;color:#5ef2a0;
    text-shadow:0 0 18px rgba(94,242,160,.5);}
  #sub{font-size:13px;line-height:1.9;opacity:.75;max-width:340px;}
  #score-final{font-size:15px;color:#ffd166;letter-spacing:2px;}
  button{font-family:inherit;font-size:15px;letter-spacing:4px;padding:15px 34px;border-radius:10px;
    border:1px solid #5ef2a0;background:rgba(94,242,160,.12);color:#5ef2a0;cursor:pointer;}
  button:active{background:rgba(94,242,160,.3);}
  #controls{position:fixed;left:0;right:0;bottom:0;height:22%;
    padding-bottom:env(safe-area-inset-bottom);display:flex;pointer-events:none;}
  .side{flex:1;pointer-events:auto;display:flex;align-items:center;justify-content:center;
    opacity:.16;font-size:34px;}
  .side:active{opacity:.45;background:rgba(255,255,255,.07);}
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<div id="hud"><span id="score">SCORE 0</span><span id="lives">♥♥♥</span></div>
<div id="controls">
  <div class="side" id="btn-left">◀</div>
  <div class="side" id="btn-fire">▲</div>
  <div class="side" id="btn-right">▶</div>
</div>
<div id="overlay">
  <h1>SPACE INVADERS</h1>
  <div id="score-final"></div>
  <div id="sub">DRAG or TAP ◀ ▶ to move<br>TAP ▲ (or just tap the sky) to fire<br>Clear the invaders before they land</div>
  <button id="start">START</button>
</div>
<script src="game.js"></script>
</body>
</html>
